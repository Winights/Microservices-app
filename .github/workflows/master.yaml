
name: Transaction

on: workflow_dispatch

jobs:
  stage_dev:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./transaction-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test
